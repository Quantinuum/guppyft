[package]
name = "guppyft-bindings"
description = "Python bindings for Guppy FT"
version = "0.1.0"
rust-version.workspace = true
edition.workspace = true
publish = false

[lints.rust]
missing_docs = "warn"

[lib]
name = "rust"
crate-type = ["cdylib", "rlib"]
# This library requires a Python runtime to be tested, and no tests currently exist
doc = false
test = false
bench = false

[dependencies]
tket = { workspace = true }
derive_more = { workspace = true }
guppyft = { path = "../rust" }

pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310", "anyhow"] }
