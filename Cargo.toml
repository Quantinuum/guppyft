[workspace]
resolver = "2"
members = [
    "rust",
    "rust-bindings",
    "extensions",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"

[workspace.dependencies]
tket = "0.21.2"
hugr = "0.29.3"
hugr-core = "0.29.3"
itertools = "0.15.0"
derive_more = { version = "2", features = ["display", "from"] }

[patch.crates-io]
hugr = { git = "https://github.com/quantinuum/hugr", rev = "e0d60817491d9f34d06931efe6d7d7f6860279eb" }
hugr-core = { git = "https://github.com/quantinuum/hugr", rev = "e0d60817491d9f34d06931efe6d7d7f6860279eb" }
hugr-cli = { git = "https://github.com/quantinuum/hugr", rev = "e0d60817491d9f34d06931efe6d7d7f6860279eb" }
hugr-model = { git = "https://github.com/quantinuum/hugr", rev = "e0d60817491d9f34d06931efe6d7d7f6860279eb" }
tket = { git = "https://github.com/quantinuum/tket2", rev = "ca0031bb57ae0b047dc7e8ffe1e193bb87cab960" }

[profile.dev-py]
inherits = "dev"

[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"
