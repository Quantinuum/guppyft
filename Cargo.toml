[workspace]
resolver = "2"
members = [
    "rust",
    "rust-bindings",
    "extensions",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"

[workspace.dependencies]
tket = "0.21.2"
hugr = "0.29.3"
hugr-core = "0.29.3"
itertools = "0.15.0"
derive_more = { version = "2", features = ["display", "from"] }

[patch.crates-io]
hugr = { git = "https://github.com/quantinuum/hugr", rev = "33a8cb4da1826314155a8d3282719863e670acf4" }
hugr-core = { git = "https://github.com/quantinuum/hugr", rev = "33a8cb4da1826314155a8d3282719863e670acf4" }
hugr-cli = { git = "https://github.com/quantinuum/hugr", rev = "33a8cb4da1826314155a8d3282719863e670acf4" }
hugr-model = { git = "https://github.com/quantinuum/hugr", rev = "33a8cb4da1826314155a8d3282719863e670acf4" }
tket = { git = "https://github.com/quantinuum/tket2", rev = "ab3f5fd5452b33b7d87278f3e914b8de90ce71d8" }

[profile.dev-py]
inherits = "dev"

[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"
