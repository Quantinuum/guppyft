[workspace]
resolver = "2"
members = [
    "rust",
    "rust-bindings",
    "extensions",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"

[workspace.dependencies]
tket = { git = "https://github.com/quantinuum/tket2", branch = "hs/feat/replace-types-array-helper"}
hugr = "0.29.3"
hugr-core = "0.29.3"
itertools = "0.15.0"
derive_more = { version = "2", features = ["display", "from"] }

[profile.dev-py]
inherits = "dev"

[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"
