[workspace]
resolver = "2"
members = [
    "rust",
    "extensions",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"

[workspace.dependencies]
tket = "0.22.0"
hugr = "0.30.2"
hugr-core = "0.30.2"
itertools = "0.15.0"
derive_more = { version = "2", features = ["display", "from", "constructor"] }

[profile.dev-py]
inherits = "dev"

[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"
