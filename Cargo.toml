[workspace]
resolver = "2"
members = [
    "rust",
    "rust-bindings",
    "extensions",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"

[workspace.dependencies]
tket = "0.20.0"
hugr = "0.28.2"
hugr-core = "0.28.2"
itertools = "0.14.0"
derive_more = { version = "2", features = ["display", "from"] }

[profile.dev-py]
inherits = "dev"

[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"

[patch.crates-io]
# Required for global ops
tket = { git = "https://github.com/quantinuum/tket2", "rev" = "e56c615" }
# Required for hugr fix
# See: https://github.com/Quantinuum/hugr/pull/3121
hugr = { git = "https://github.com/quantinuum/hugr", "rev" = "7ccd635" }
hugr-core = { git = "https://github.com/quantinuum/hugr", "rev" = "7ccd635" }
hugr-model = { git = "https://github.com/quantinuum/hugr", "rev" = "7ccd635" }
