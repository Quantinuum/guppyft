[workspace]
resolver = "2"
members = [
    "rust",
    "extensions",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"

[workspace.dependencies]
# Binary ECC loading is unused and pulls in an older, vulnerable zstd dependency.
tket = { version = "0.22.0", default-features = false }
hugr = "0.30.3"
hugr-core = "0.30.3"
itertools = "0.15.0"
derive_more = { version = "2", features = ["display", "from"] }
anyhow = "1.0.104"

[profile.dev-py]
inherits = "dev"

[profile.release-py]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"

# Match the HUGR pointer contract used by the local Guppy Cell build.
[patch.crates-io]
hugr = { git = "https://github.com/quantinuum/hugr", rev = "793b1014f490eca899cae0f49d46b3187bfc8da6" }
hugr-core = { git = "https://github.com/quantinuum/hugr", rev = "793b1014f490eca899cae0f49d46b3187bfc8da6" }
hugr-model = { git = "https://github.com/quantinuum/hugr", rev = "793b1014f490eca899cae0f49d46b3187bfc8da6" }
hugr-cli = { git = "https://github.com/quantinuum/hugr", rev = "793b1014f490eca899cae0f49d46b3187bfc8da6" }
hugr-llvm = { git = "https://github.com/quantinuum/hugr", rev = "793b1014f490eca899cae0f49d46b3187bfc8da6" }
