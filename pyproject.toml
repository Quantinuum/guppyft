[project]
name = "guppy-ft"
version = "0.1.0"
description = "Tools for fault-tolerant quantum computing in the Guppy langauge"
requires-python = ">=3.13,<4"
license = { file = "LICENCE" }
authors = [
    { name = "Maximilian Rüsch", email = "maximilian.ruesch@quantinuum.com" },
    { name = "TKET development team", email = "tket-support@quantinuum.com" },
]
maintainers = [
    { name = "Maximilian Rüsch", email = "maximilian.ruesch@quantinuum.com" },
    { name = "TKET development team", email = "tket-support@quantinuum.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "guppylang>=0.21.13",
    "guppylang-internals>=0.34.0",
    "hugr>=0.16.0",
    "tket>=0.13.0",
]

[dependency-groups]
dev = [
    "maturin>=1.7.0,<2",
    "mypy>=1.20.2",
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "pre-commit>=3.6.0,<5",
    "ruff>=0.15.11",
]
test = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "guppyft._bindings"
python-source = "src/"
manifest-path = "encoder-bindings/Cargo.toml"
features = ["pyo3/extension-module"] # skips linking against libpython.so
profile = "release-py" # See root Cargo.toml
