[project]
name = "guppy-ft"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "guppylang>=0.21.11",
    "guppylang-internals>=0.32.0",
    "hugr>=0.16.0",
    "tket>=0.13.0",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[dependency-groups]
dev = [
    "maturin>=1.7.0,<2",
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.15.11",
]
test = [
    "pytest>=9.0.3",
    "selene-hugr-qis-compiler>=0.2.10",
    "selene-sim>=0.2.13",
]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.uv.sources]
# Needs the latest Guppy release with hugr/tket upgrade, as well as Guppy libraries
guppylang = { git = "https://github.com/quantinuum/guppylang", branch = "main", subdirectory = "guppylang" }
guppylang-internals = { git = "https://github.com/quantinuum/guppylang", branch = "main", subdirectory = "guppylang-internals" }
# Needs tket branch for globals extension
tket = { git = "https://github.com/quantinuum/tket2", branch = "mr/feat/globals-extension", subdirectory = "tket-py" }
selene-hugr-qis-compiler = { git = "https://github.com/quantinuum/tket2", branch = "mr/feat/globals-extension", subdirectory = "qis-compiler" }

[tool.maturin]
module-name = "guppyft._bindings"
python-source = "src/"
manifest-path = "encoder-bindings/Cargo.toml"
features = ["pyo3/extension-module"] # skips linking against libpython.so
profile = "release-py" # See root Cargo.toml
