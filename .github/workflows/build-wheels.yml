name: Build wheels

on:
  push:
    branches:
      - main
      - "release-please--*"
    tags:
      - "v*"
  workflow_dispatch:

env:
  UV_EXTRA_INDEX_URL: "https://${{ secrets.QTNM_ARTIF_SW_READ_USER }}:${{ secrets.QTNM_ARTIF_SW_READ_TOKEN }}@quantinuumsw.jfrog.io/artifactory/api/pypi/pypi_local/simple"

jobs:
  build_wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel runners are x86_64
        os: [ ubuntu-latest, ubuntu-22.04-arm, macos-latest, macos-15-intel, windows-latest ]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - uses: actions/cache@v5
        if: runner.os != 'Linux'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build guppyft wheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: 'wheelhouse'

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*guppyft*.whl

  release:
    name: Release wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build_wheels ]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheelhouse
          merge-multiple: true

      - name: Update GitHub release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: wheelhouse/*guppyft*.whl

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Upload guppyft wheels to SW artifactory
        run: |
          uvx twine upload --verbose --non-interactive wheelhouse/*guppyft*.whl
        env:
          TWINE_REPOSITORY_URL: "https://quantinuumsw.jfrog.io/artifactory/api/pypi/pypi_local/"
          TWINE_USERNAME: ${{ secrets.QTNM_ARTIF_SW_WRITE_USER }}
          TWINE_PASSWORD: ${{ secrets.QTNM_ARTIF_SW_WRITE_TOKEN }}