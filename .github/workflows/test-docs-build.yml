name: Test sphinx docs build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
   contents: read
  
jobs:
    test:
      name: Test sphinx docs
      runs-on: ubuntu-latest
      env:
          UV_FROZEN: 1
      steps:
        - uses: actions/checkout@v7

        - name: Install stable Rust toolchain
          uses: dtolnay/rust-toolchain@stable

        - uses: extractions/setup-just@v4
          with:
            just-version: '1.58.0'

        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
              enable-cache: true
              version: "0.11.3"

        - name: Set up compiler source dependencies
          uses: ./.github/actions/setup-compiler-source

        - name: Run the docs build
          run: just build-docs