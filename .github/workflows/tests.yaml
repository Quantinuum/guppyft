name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch: { }

# Limits the number of concurrent runs of this workflow for branches to one. For non-main branches, runs caused by newly
# pushed commits thus cancel any in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  UV_VERSION: "0.11.7"

jobs:
  check-py:
    name: 🐍 Test Python code (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install hugrenv
        uses: Quantinuum/hugrverse-env/install-hugrenv-action@main
        with:
          packages: llvm,tket
          lockfile: hugrenv.lock

      - name: Install dependencies
        run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Run tests
        run: uv run pytest
