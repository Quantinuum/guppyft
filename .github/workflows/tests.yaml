name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch: { }

# Limits the number of concurrent runs of this workflow for branches to one. For non-main branches, runs caused by newly
# pushed commits thus cancel any in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  UV_VERSION: "0.11.7"

jobs:
  check-py:
    name: 🐍 Test Python code (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # adapted from https://github.com/TheDan64/inkwell/blob/master/.github/workflows/test.yml
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt install --no-install-recommends -y libllvm21 llvm-21 llvm-21-dev llvm-21-runtime libpolly-21-dev
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-21 10

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install conan
        run: |
          uv tool install conan
          uvx conan profile detect

      - name: Install dependencies
        run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Run tests
        run: uv run pytest
