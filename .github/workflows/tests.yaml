name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    # Nightly at 4am
    - cron: '0 4 * * *'
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:
    inputs:
      run_long_tests:
        description: "Run the long Python tests"
        type: boolean
        default: false
        required: false

# Limits the number of concurrent runs of this workflow for branches to one. For non-main branches, runs caused by newly
# pushed commits thus cancel any in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  UV_VERSION: "0.11.7"

permissions:
  contents: read

jobs:
  # Check if changes were made to the relevant files.
  # Always returns true if running on the default branch, to ensure all changes are thoroughly checked.
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      extensions: ${{ steps.filter.outputs.extensions }}
      extensions_data: ${{ steps.filter.outputs.extensions_data }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-changes
        id: filter

  # Run tests on Rust stable
  check-rs:
    name: Test Rust code 🦀
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
      - name: Configure default rust toolchain
        run: rustup override set ${{steps.toolchain.outputs.name}}
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with all features
        run: cargo nextest r --verbose --workspace
      - name: Clean existing coverage data
        run: cargo llvm-cov clean --workspace
      - name: Generate coverage report
        run: cargo llvm-cov --all-features report --codecov --output-path coverage.json
      - name: Upload Rust coverage to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: coverage.json
          name: rust
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  check-py:
    name: 🐍 Test Python code (${{ matrix.python-version.py }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version.py }}
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      GUPPYFT_RUN_LONG_TESTS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_long_tests) }}

    strategy:
      matrix:
        python-version:
        - { py: "3.12", coverage: false }
        - { py: "3.14", coverage: true }
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Run tests
        if: ${{ !matrix.python-version.coverage }}
        run: uv run pytest -n auto

      - name: Run Python tests with coverage
        if: ${{ matrix.python-version.coverage }}
        run: uv run pytest -n auto --cov=./ --cov-report-xml
      - name: Upload Python coverage to codecov.io
        if: ${{ matrix.python-version.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          name: python
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  # Ensure that serialized extensions match rust implementation
  check-extensions:
    name: Check extensions
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Generate the updated definitions
        run: just gen-extensions
      - name: Check if the definitions are up to date
        run: |
          git diff --exit-code --name-only src/guppyft/extensions/data
          if [ $? -ne 0 ]; then
            echo "The serialized standard extensions are not up to date."
            echo "Please run 'just gen-extensions' and commit the changes.
            "
            exit 1
          fi

  extension-versions:
    name: Check extension versions
    needs: [ changes ]
    if: ${{ needs.changes.outputs.extensions_data == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full history to compare with main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check if extension versions are updated
        run: python ./.github/scripts/check_extension_versions.py

  # This is a meta job to mark successful completion of the required checks,
  # even if they are skipped due to no changes in the relevant files.
  required-checks:
    name: Required checks 🦀+🐍
    needs:
      [
        changes,
        check-rs,
        check-py,
        check-extensions,
        extension-versions,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if required checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Required checks failed"
          echo "Please check the logs for more information"
          exit 1
      - name: Pass if required checks passed
        run: |
          echo "All required checks passed"
