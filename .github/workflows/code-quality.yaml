name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch: { }

# Limits the number of concurrent runs of this workflow for branches to one. For non-main branches, runs caused by newly
# pushed commits thus cancel any in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  UV_VERSION: "0.11.7"

jobs:
  check-lockfiles:
    name: Check lock files
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: 3.13

    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Ensure uv lockfile is up to date
        run: uv lock

      - name: Ensure cargo lockfile is up to date
        run: cargo generate-lockfile --locked

  check-py:
    name: 🐍 Check Python code (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

    strategy:
      matrix:
        python-version: [ "3.13", "3.14" ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install hugrenv
        uses: Quantinuum/hugrverse-env/install-hugrenv-action@main
        with:
          packages: llvm,tket
          lockfile: hugrenv.lock

      - name: Install dependencies
        run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Check formatting with ruff
        run: |
          uv run ruff --version
          uv run ruff format --check

      - name: Lint with ruff
        run: |
          uv run ruff --version
          uv run ruff check

      - name: Type check with mypy
        run: uv run mypy .

  check-rs:
    name: 🦀 Check Rust code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install stable rust toolchain with fmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Build docs
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: "-Dwarnings"
