name: Semantic Versioning
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
  merge_group:
    types: [ checks_requested ]

permissions:
  pull-requests: write
  contents: read

# Limits the number of concurrent runs of this workflow for branches to one. For non-main branches, runs caused by newly
# pushed commits thus cancel any in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  UV_VERSION: "0.11.7"

jobs:
  semver-checks-py:
    name: 🐍 Check Python code breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install hugrenv
        uses: Quantinuum/hugrverse-env/install-hugrenv-action@main
        with:
          packages: llvm,tket
          lockfile: hugrenv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - uses: quantinuum/hugrverse-actions/py-semver-checks@main
        with:
          packages: src/guppyft
          token: ${{ github.token }}


  semver-checks-rs:
    name: 🦀 Check Rust code breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install stable rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: quantinuum/hugrverse-actions/rs-semver-checks@main
        with:
          token: ${{ github.token }}
