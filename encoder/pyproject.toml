[project]
name = "guppy-ft-encoder"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "hugr>=0.16.0",
    "maturin>=1.12.6",
]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Make sure to copy any changes to the root `pyproject.toml` config too.
module-name = "guppy_ft_encoder._bindings"
python-source = "src/"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"] # skips linking against libpython.so
profile = "release-py" # See Cargo.toml
